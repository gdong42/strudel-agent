[project]
name = "strudel-agent-backend"
version = "0.1.0"
description = "Local FastAPI backend for the Strudel agent runtime shell"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
test = [
  "httpx>=0.28.0",
  "pytest>=8.0.0"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
