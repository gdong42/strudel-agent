<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strudel Agent</title>
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>Strudel Agent</h1>
        <p>Local runtime shell for Strudel live vibe coding.</p>
      </div>
      <div class="controls" aria-label="Playback controls">
        <button id="evaluate" type="button">Evaluate</button>
        <button id="revert-last-good" type="button" disabled>Revert</button>
        <button id="stop" type="button">Stop</button>
        <button id="panic" type="button">Panic</button>
        <button id="open-settings" type="button">Settings</button>
      </div>
      <div id="status" class="status" data-status="warn">Starting...</div>
    </header>
    <main class="app-shell">
      <section id="repl-host" class="repl-host" aria-label="Strudel editor">
        <strudel-editor id="repl"></strudel-editor>
      </section>
      <aside class="side-panel" aria-label="Project status">
        <section class="agent-panel" aria-labelledby="agent-heading">
          <h2 id="agent-heading">Agent</h2>
          <form id="agent-form">
            <textarea id="agent-intent" rows="3" placeholder="Describe a musical change" required></textarea>
            <label class="auto-fire"><input id="auto-fire" type="checkbox"> Auto Fire</label>
            <div class="agent-actions"><button id="stage-change" type="submit">Stage change</button><button id="undo-change" type="button" disabled>Undo</button></div>
          </form>
          <p class="provider-summary">Provider: <span id="agent-provider-summary">loading...</span></p>
          <p id="agent-explanation">No staged agent change.</p>
          <div id="agent-warnings" aria-live="polite"></div>
          <div id="agent-diff" class="diff-view" aria-label="Staged code diff"></div>
        </section>
        <h2>Track</h2>
        <p><code>tracks/main.strudel.js</code></p>
        <p>Evaluate fires the Strudel REPL, then saves a snapshot only if evaluation succeeds.</p>
        <h2>Snapshots</h2>
        <div id="snapshot-list" class="snapshot-list" aria-live="polite">No snapshots yet.</div>
      </aside>
    </main>
    <dialog id="settings-dialog" aria-labelledby="settings-heading">
      <form id="settings-form" class="settings-form">
        <div class="dialog-heading">
          <h2 id="settings-heading">Agent settings</h2>
          <button id="close-settings" type="button" aria-label="Close settings">Close</button>
        </div>
        <label>Provider<select id="settings-provider"></select></label>
        <label>Model<input id="settings-model" type="text" placeholder="Use provider default"></label>
        <label>API key<input id="settings-api-key" type="password" autocomplete="off" placeholder="Not required"></label>
        <label class="remember-key"><input id="settings-remember-key" type="checkbox"> Remember on this device</label>
        <div class="settings-actions">
          <button id="test-provider" type="button">Test connection</button>
          <button id="clear-api-key" type="button">Clear key</button>
          <button type="submit">Save</button>
        </div>
        <p id="settings-message" class="settings-message" aria-live="polite"></p>
      </form>
    </dialog>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
